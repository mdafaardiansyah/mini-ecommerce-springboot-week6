# ========================================
# DEVELOPMENT ENVIRONMENT
# ========================================
spring:
  datasource:
    # Use Spring Boot standard environment variable names
    # Jenkins sets SPRING_DATASOURCE_*, so we reference those
    # Fallback to local MySQL if env vars not set
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/w5p1_db_dev}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 10000
      pool-name: DevHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: 8080

# ========================================
# DEVELOPMENT LOGGING CONFIGURATION
# ========================================
logging:
  file:
    name: logs/dev/product-service-dev.log

  level:
    root: INFO
    edts.week6_practice1: DEBUG

    # Spring Framework
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.boot: INFO

    # HikariCP - Enable DEBUG to see pool configuration
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG

    # Hibernate - show SQL queries
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 500MB
