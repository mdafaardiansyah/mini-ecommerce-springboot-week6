# ========================================
# PRODUCTION ENVIRONMENT
# ========================================
spring:
  datasource:
    # Use Spring Boot standard environment variable names
    # Jenkins sets SPRING_DATASOURCE_*, so we reference those directly
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
      pool-name: ProdHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

server:
  port: ${SERVER_PORT:8080}

# ========================================
# PRODUCTION LOGGING CONFIGURATION
# ========================================
logging:
  file:
    name: ${LOG_FILE:logs/prod/product-service-prod.log}

  level:
    root: WARN
    edts.week6_practice1: INFO

    # Spring Framework - minimal logging in production
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.boot: WARN

    # HikariCP - only warnings and errors
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.HikariConfig: WARN

    # Hibernate - only errors
    org.hibernate: WARN
    org.hibernate.SQL: WARN

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 60
      total-size-cap: 10GB
