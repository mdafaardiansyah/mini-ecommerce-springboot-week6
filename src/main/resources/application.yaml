# ========================================
# BASIC CONFIGURATION (Base)
# ========================================

spring:
  application:
    name: service-week6-miniproject
  # profiles:
  #   active: dev  ← DON'T SET DEFAULT PROFILE! Let Heroku env var control it

  # ========================================
  # JACKSON JSON CONFIGURATION (ISO 8601)
  # ========================================
  jackson:
    # Set default timezone to UTC for all date/time serialization
    time-zone: UTC
    # Use ISO 8601 format with 'Z' suffix for UTC dates
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    # Handle null values gracefully
    default-property-inclusion: non_null

  # ========================================
  # SPRING MVC CONFIGURATION
  # ========================================
  mvc:
    # Enable content negotiation for API versioning
    contentnegotiation:
      favor-parameter: true
      parameter-name: format
    # Throw exception if no handler found (instead of 404)
    throw-exception-if-no-handler-found: true

# ========================================
# LOGGING CONFIGURATION (Base)
# ========================================
logging:
  # Pattern untuk console output
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  # Log level defaults (di-override di tiap profile)
  level:
    root: INFO
    edts.week6_practice1: DEBUG

  # File rolling configuration (di-override di tiap profile)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  simple:
    metrics:
      export:
        enabled: true

# ========================================
# CUSTOM CONFIGURATION
# ========================================

# ========================================
# SERVER CONFIGURATION
# ========================================
server:
  port: 8080
  # Enable response compression (GZIP)
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024  # Only compress responses larger than 1KB
