# ========================================
# BASIC CONFIGURATION (Base)
# ========================================

spring:
  application:
    name: service-week6-miniproject
  # profiles:
  #   active: dev  ← DON'T SET DEFAULT PROFILE! Let Heroku env var control it

# ========================================
# LOGGING CONFIGURATION (Base)
# ========================================
logging:
  # Pattern untuk console output
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  # Log level defaults (di-override di tiap profile)
  level:
    root: INFO
    edts.week6_practice1: DEBUG

  # File rolling configuration (di-override di tiap profile)
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  simple:
    metrics:
      export:
        enabled: true

# ========================================
# CUSTOM CONFIGURATION
# ========================================

# ========================================
# SERVER CONFIGURATION
# ========================================
server:
  port: 8080
